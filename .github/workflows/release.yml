name: Release Binaries (Windows 11 / Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.4.0). Leave empty for dry-run artifact build."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Release (Windows 11 x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build optimized ve-app.exe
        run: cargo build --release -p ve-app

      - name: Package Windows ZIP + SHA-256
        shell: pwsh
        run: |
          $stage = "stage/ve-app-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Copy-Item "target/release/ve-app.exe" "$stage/ve-app.exe"
          Copy-Item -Recurse "shaders" "$stage/shaders"
          Copy-Item "LICENSE-MIT" "$stage/LICENSE-MIT"
          Copy-Item "LICENSE-APACHE" "$stage/LICENSE-APACHE"
          Copy-Item "README.md" "$stage/README.md"
          if (Test-Path "CHANGELOG.md") {
            Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          }

          $zipPath = "dist/ve-app-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  ve-app-windows-x64.zip" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: ve-app-windows-x64
          path: dist/

  build-linux:
    name: Build Release (Ubuntu Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/font dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build optimized ve-app binary
        run: cargo build --release -p ve-app

      - name: Package Linux tar.gz + SHA-256
        run: |
          STAGE="stage/ve-app-linux-x64"
          mkdir -p "$STAGE" dist
          cp target/release/ve-app "$STAGE/ve-app"
          chmod +x "$STAGE/ve-app"
          cp -r shaders "$STAGE/shaders"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE/"
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md "$STAGE/"
          fi
          tar -C stage -czf dist/ve-app-linux-x64.tar.gz ve-app-linux-x64
          (cd dist && sha256sum ve-app-linux-x64.tar.gz > ve-app-linux-x64.tar.gz.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: ve-app-linux-x64
          path: dist/

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Next-Gen Hybrid Video Editor $TAG" \
              --generate-notes
          fi
